<header class="header">
  <div class="inner">
    <div class="logo">
      <div class="icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="35"
          height="35"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-graduation-cap w-8 h-8 text-[#1773b0]"
          aria-hidden="true"
        >
          <path
            d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
          ></path>
          <path d="M22 10v6"></path>
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
        </svg>
      </div>
      <div>
        <h1 class="logo-title">English Academy</h1>
        <div class="logo-sub">Admin Panel</div>
      </div>
    </div>

    <nav class="header-nav" role="navigation">
      <button class="nav-btn" data-nav="dashboard">Inicio</button>
      <button class="nav-btn" data-nav="perfil">Perfil</button>
      <button class="nav-btn" data-nav="foro">Foro</button>
      <button class="nav-btn" data-nav="pagos">Pagos</button>
      <button class="nav-btn" data-nav="actividades">Actividades</button>
    </nav>

    <div class="user">
      <div class="user-info">
        <p class="user-greet" style="opacity: 0; transition: opacity 0.3s ease">
          Hola, Admin
        </p>
        <div class="user-role">Administrador</div>
      </div>
      <div class="avatar" style="opacity: 0; transition: opacity 0.3s ease">
        A
      </div>

      <!-- New Action Buttons -->
      <div
        style="
          display: flex;
          gap: 8px;
          margin-left: 12px;
          border-left: 1px solid #ddd;
          padding-left: 12px;
        "
      >
        <button
          id="btn-go-frontend"
          class="nav-btn"
          style="
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          title="Ir a Frontend Cliente"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-external-link"
          >
            <path
              d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            ></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <button
          id="btn-logout"
          class="nav-btn"
          style="
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          title="Cerrar Sesión"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-log-out"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<script>
  (function () {
    const path = window.location.pathname;
    const subdirs = ["actividades", "foro", "pagos", "perfil"];
    const currentPath = path.toLowerCase();
    const currentSubdir = subdirs.find((s) =>
      currentPath.includes("/" + s + "/")
    );

    // Determine path prefix: ./ for root Admin files, ../ for subdirectory files
    const prefix = currentSubdir ? "../" : "./";

    const s = document.createElement("script");
    s.src = prefix + "header.js?v=" + new Date().getTime(); // Add cache buster
    s.async = false;
    document.head.appendChild(s);
  })();
</script>
