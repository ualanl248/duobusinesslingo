<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Conceder permisos de administrador - Admin</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../app.css" />
  </head>
  <body>
    <div id="header-root"></div>

    <div id="root">
      <div class="app-body">
        <aside class="sidebar">
          <div class="section-title">Opciones del Módulo</div>
          <div class="sidebar-options">
            <div class="option active" data-option="permisos">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-shield w-5 h-5 text-white"
                aria-hidden="true"
              >
                <path
                  d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
                ></path>
              </svg>
              Conceder permisos de administrador
            </div>
            <div class="option" data-option="difusion">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users w-5 h-5 text-[#1773b0]" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
            Enviar correos de difusión
            </div>
            <div class="option" data-option="ajustes">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-settings w-5 h-5 text-[#1773b0]"
                aria-hidden="true"
              >
                <path
                  d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
                ></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              Ajustes generales de la cuenta
            </div>
          </div>
        </aside>

        <main class="content">
          <div id="content-area" class="content-section">
            <!-- Content rendered by permisos.js -->
          </div>
        </main>
      </div>

      <div class="footer">© 2025 English Academy - Admin Panel</div>
    </div>

    <script>
      // Load header.html dynamically and execute dependent scripts after
      fetch("../header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header-root").innerHTML = html;
          // Execute scripts inside the fetched header fragment
          Array.from(
            document.getElementById("header-root").querySelectorAll("script")
          ).forEach((oldScript) => {
            const s = document.createElement("script");
            if (oldScript.src) {
              s.src = oldScript.src;
              s.async = false;
              document.head.appendChild(s);
            } else {
              s.textContent = oldScript.textContent;
              document.head.appendChild(s);
            }
            oldScript.remove();
          });
        })
        .catch((err) => console.error("Failed to load header:", err));
    </script>

    <script>
      // Sidebar navigation
      document.addEventListener("click", function (e) {
        const opt = e.target.closest(".option");
        if (!opt) return;
        document
          .querySelectorAll(".option")
          .forEach((x) => x.classList.remove("active"));
        opt.classList.add("active");
        const v = opt.dataset.option;
        // Navigate to corresponding subpage
        window.location.href = v + ".html";
      });
    </script>

    <script src="permisos.js"></script>
    <script src="../js/auth-guard.js"></script>

  </body>
</html>
