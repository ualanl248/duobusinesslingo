<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reembolsos - Admin</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../app.css" />
  </head>
  <body>
    <div id="header-root"></div>

    <div id="root">
      <div class="app-body">
        <aside class="sidebar">
          <div class="section-title">Opciones del Módulo</div>
          <div class="sidebar-options">
            <div class="option" data-option="pagos-realizados">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-credit-card w-5 h-5 text-white"
                aria-hidden="true"
              >
                <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                <line x1="2" x2="22" y1="10" y2="10"></line>
              </svg>
              Ver pagos realizados
            </div>
            <div class="option active" data-option="reembolsos">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-refresh-cw w-5 h-5 text-[#1773b0]"
                aria-hidden="true"
              >
                <path
                  d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                ></path>
                <path d="M21 3v5h-5"></path>
                <path
                  d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                ></path>
                <path d="M8 16H3v5"></path>
              </svg>
              Reembolsos y cancelaciones
            </div>
            <div class="option" data-option="planes">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-dollar-sign w-5 h-5 text-[#1773b0]"
                aria-hidden="true"
              >
                <line x1="12" x2="12" y1="2" y2="22"></line>
                <path
                  d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
                ></path>
              </svg>

              Gestionar planes y precios
            </div>
          </div>
        </aside>

        <main class="content">
          <div id="content-area" class="content-section">
            <!-- Content rendered by reembolsos.js -->
          </div>
        </main>
      </div>

      <div class="footer">© 2025 English Academy - Admin Panel</div>
    </div>

    <script>
      // Load header.html dynamically and execute dependent scripts after
      fetch("../header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header-root").innerHTML = html;
          // Execute scripts inside the fetched header fragment
          Array.from(
            document.getElementById("header-root").querySelectorAll("script")
          ).forEach((oldScript) => {
            const s = document.createElement("script");
            if (oldScript.src) {
              s.src = oldScript.src;
              s.async = false;
              document.head.appendChild(s);
            } else {
              s.textContent = oldScript.textContent;
              document.head.appendChild(s);
            }
            oldScript.remove();
          });
        })
        .catch((err) => console.error("Failed to load header:", err));
    </script>

    <script>
      // Sidebar navigation
      document.addEventListener("click", function (e) {
        const opt = e.target.closest(".option");
        if (!opt) return;
        document
          .querySelectorAll(".option")
          .forEach((x) => x.classList.remove("active"));
        opt.classList.add("active");
        const v = opt.dataset.option;
        // Navigate to corresponding subpage
        window.location.href = v + ".html";
      });
    </script>

    <script src="reembolsos.js"></script>
    <script src="../js/auth-guard.js"></script>

  </body>
</html>
