<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="recover.meta.title">Nueva contraseña | Global Speak Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/recover-password.css">
</head>

<body class="recover-password-page" data-partials-base="./">
  <!-- Header por include -->
  <div id="site-header"></div>

  <main>
    <section class="section gradient-soft">
      <div class="shell shell-narrow">
        <div class="form-card">
          <h2 class="accent recover-title" data-i18n="recover.title">Crear nueva contraseña</h2>
          <p class="recover-subtitle" data-i18n="recover.subtitle">Crea una contraseña fuerte para tu cuenta.</p>

          <form id="recover-password-form" class="recover-form" novalidate>
            <div class="field">
              <label for="new-password" data-i18n="recover.new.label">Nueva contraseña</label>
              <input id="new-password" type="password" autocomplete="new-password" required
                data-i18n-placeholder="recover.new.placeholder" placeholder="Mínimo 8 caracteres">
            </div>

            <div class="field">
              <label for="confirm-password" data-i18n="recover.confirm.label">Confirmar contraseña</label>
              <input id="confirm-password" type="password" autocomplete="new-password" required
                data-i18n-placeholder="recover.confirm.placeholder" placeholder="Confirma tu contraseña">
            </div>

            <div class="form-alert" id="recover-alert" role="alert" aria-live="polite"></div>

            <button class="btn primary" id="recover-submit" type="submit" data-i18n="recover.submit">
              Cambiar contraseña
            </button>
          </form>

          <p class="recover-back">
            <a href="./login.html" data-i18n="recover.back">← Volver a iniciar sesión</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer por include -->
  <div id="site-footer"></div>

  <!-- Orden recomendado -->
  <script src="./i18n.js"></script>
  <script src="./includes.js"></script>
  <script src="./script.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cookie-consent.js"></script>
  <script src="./js/recover-password.js"></script>
</body>

</html>
